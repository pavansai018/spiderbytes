controller_manager:
  ros__parameters:
    update_rate: 100  # 100–500 ok

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - hip_joint_fl
      - knee_joint_fl
      - leg_joint_fl
      - hip_joint_fr
      - knee_joint_fr
      - leg_joint_fr
      - hip_joint_rl
      - knee_joint_rl
      - leg_joint_rl
      - hip_joint_rr
      - knee_joint_rr
      - leg_joint_rr

    # This must match with ros2_control hardware exposes
    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    # Controller behavior
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    open_loop_control: true
    interpolation_method: splines   # or "none" (splines is smoother)

    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 0.2
